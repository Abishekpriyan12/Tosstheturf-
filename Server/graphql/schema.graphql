# Enums for predefined values
enum Timing {
  "5 AM to 9 AM"
  FIVE_AM_TO_NINE_AM
  "9 AM to 1 PM"
  NINE_AM_TO_ONE_PM
  "1 PM to 5 PM"
  ONE_PM_TO_FIVE_PM
  "5 PM to 9 PM"
  FIVE_PM_TO_NINE_PM
}

enum Location {
  "Cambridge"
  CAMBRIDGE
  "Waterloo"
  WATERLOO
  "Kitchner"
  KITCHNER
}

# User type for authentication and role management
type User {
  id: String!
  firstName: String!
  lastName: String!
  email: String!
  password: String!
  role: String!
  token: String
}

# Navigation items for the application
type NavItem {
  id: ID!
  name: String!
  url: String!
}

# Amenities for the turf
type Amenities {
  parking: Boolean!
  drinkingWater: Boolean!
  spareKits: Boolean!
  nonAC: Boolean!
}

# Turf details
type Turf {
  id: ID!
  turfName: String!
  userId: String!
  ownerName: String!
  location: String!
  address: String!
  phone: String!
  amenities: Amenities!
  timing: String!
  mainImage: String!
  sliderImages: [String!]!
  sportType: String!
  price: String!
  firstTimeDiscount: String
  status: String! # Status to track turf approval
}
type Mutation {
  updateTurf(
    id: ID!
    turfName: String!
    address: String!
    location: String!
    phone: String!
    amenities: AmenitiesInput!
    timing: String!
    mainImage: String!
    sliderImages: [String!]!
    sportType: String!
    price: String!
    firstTimeDiscount: String
  ): Turf!
}

type Mutation {
  deleteTurf(id: ID!): Turf
}
# Review details
type Review {
  id: ID!
  turfId: ID!
  username: String!
  rating: Float!
  review: String!
  createdAt: String!
}

# Reviews response with calculated average rating
type ReviewsResponse {
  averageRating: Float!
  reviews: [Review!]!
}

# Booking details
type Booking {
    id: ID!
    userId: String!
    turfName: String!
    turfId: Turf!
    date: String!
    time: [String!]!
    duration: Int!
    price: Float! # Total price for the user
    userServiceFee: Float! # 3% fee for the user
    adminServiceFee: Float! # 7% fee for the owner
    ownerEarnings: Float! # Owner earnings after admin fee
    createdAt: String!
}

# Root Query type
type Query {
  # Fetch navigation items
  getNavItems: [NavItem!]!

  # Fetch all turfs
  getTurfs: [Turf!]!

  # Fetch a specific turf by ID
  turf(id: ID!): Turf

  # Fetch a specific user by ID
  getUser(id: ID!): User

  # Fetch bookings by user
  getBookings(userId: ID!): [Booking!]!

  # Fetch bookings for a specific turf on a specific date
  getBookingsByTurfAndDate(turfId: ID!, date: String!): [Booking!]!

  # Fetch reviews for a specific turf with average rating
  getReviews(turfId: ID!): ReviewsResponse!

  # Fetch fully booked dates for a specific turf
  getFullyBookedDates(turfId: ID!): [String!]!
  getPendingTurfs: [Turf!]!
  getOwnerTurfs(ownerName: String!): [Turf!]!
  getOwnerBookings(turfId: ID!): [Booking!]!
  getAllBookings: [Booking!]!
}

# Root Mutation type
type Mutation {
  # Signup for new users
  signup(
    id: String!
    firstName: String!
    lastName: String!
    email: String!
    password: String!
    role: String!
  ): User!

  # Login for existing users
  login(email: String!, password: String!, role: String!): User!

  updateUser(id: ID!, firstName: String, lastName: String, email: String): User

  # Add a new turf
  addTurf(
    turfName: String!
    ownerName: String!
    userId: String!
    location: String!
    address: String!
    phone: String!
    amenities: AmenitiesInput!
    timing: String!
    mainImage: String!
    sliderImages: [String!]!
    sportType: String!
    price: String!
    firstTimeDiscount: String
    status: String! # Add status field
  ): Turf!

  # Create a new booking
 createBooking(
        userId: ID!
        turfName: String!
        turfId: ID!
        date: String!
        time: [String!]!
        duration: Int!
        price: Float!
        userServiceFee: Float!
        adminServiceFee: Float!
        ownerEarnings: Float!
    ): Booking!

  # Cancel an existing booking
  cancelBooking(bookingId: ID!): String!

  # Add a new review
  addReview(
    turfId: ID!
    username: String!
    rating: Float!
    review: String!
  ): Review!

  #confirm the booking after payment
  confirmBooking(
    paymentIntentId: String
    userId: ID!
    turfId: ID!
    turfName: String!
    date: String!
    time: [String!]!
    duration: Int!
    price: Float!
  ): Booking!

  createPaymentIntent(amount: Int!, currency: String!): PaymentIntentResponse!
  # Approve a turf (Admin only)
  approveTurf(turfId: ID!): Turf!

  # Reject a turf (Admin only)
  rejectTurf(turfId: ID!): Turf!
}

# Input type for amenities
input AmenitiesInput {
  parking: Boolean!
  drinkingWater: Boolean!
  spareKits: Boolean!
  nonAC: Boolean!
}

type PaymentIntentResponse {
  id: String
  clientSecret: String!
}
type Mutation {
  sendMessage(userId: String!, message: String!): ChatResponse!
}

type ChatResponse {
  message: String!
  botResponse: String!
}